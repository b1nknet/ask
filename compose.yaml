x-app-environment: &app-environment
  DATABASE_URL: file:/app/data/ask.db
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run npm run setup or set BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:3000}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

services:
  migrate:
    image: ghcr.io/b1nknet/ask-tools:latest
    environment: *app-environment
    volumes:
      - ./data:/app/data
    command: ["npm", "run", "db:deploy"]

  app:
    image: ghcr.io/b1nknet/ask:latest
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  tools:
    image: ghcr.io/b1nknet/ask-tools:latest
    profiles: ["tools"]
    environment:
      <<: *app-environment
      # Only used by admin:create to convert a legacy email account.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
